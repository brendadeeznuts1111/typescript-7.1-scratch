name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: ci:local
        run: bun run ci:local

      - name: Upload contract receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-receipts
          path: artifacts/contracts/
